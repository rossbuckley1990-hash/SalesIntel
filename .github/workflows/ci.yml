name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# No secrets are used. AI keys are blanked so no test can make a paid model call,
# and the browser tests run in demo mode, which refuses AI research outright.
env:
  ANTHROPIC_API_KEY: ""
  OPENAI_API_KEY: ""
  COMPANIES_HOUSE_API_KEY: ""

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e "backend[dev]"
      - name: Migrations build the schema from scratch
        run: |
          cd backend
          DATABASE_URL="sqlite:///$RUNNER_TEMP/migrations.db" ../.venv/bin/python -m alembic -c alembic.ini upgrade head
      - name: Tests
        run: PYTHONPATH=backend .venv/bin/python -m pytest backend/tests -q

  frontend:
    name: Frontend unit tests and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: TypeScript
        run: pnpm --dir frontend typecheck
      - name: Unit tests
        run: pnpm --dir frontend test

  e2e:
    name: Playwright acceptance tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e "backend[dev]"
          pnpm install --frozen-lockfile
          pnpm --dir frontend exec playwright install --with-deps chromium
      - name: Acceptance tests (demo database, synthetic fixtures)
        run: pnpm --dir frontend test:e2e
      - name: Keep the report when tests fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
