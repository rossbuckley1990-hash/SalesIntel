name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# No secrets are used. AI keys are blanked so no test can make a paid model call,
# and the browser tests run in demo mode, which refuses AI research outright.
env:
  ANTHROPIC_API_KEY: ""
  OPENAI_API_KEY: ""
  COMPANIES_HOUSE_API_KEY: ""

jobs:
  backend:
    name: Backend tests (SQLite and PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A throwaway PostgreSQL for the hosted-platform tests. Each test creates and drops its own database.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: salesintel
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U salesintel" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SALESINTEL_TEST_POSTGRES_URL: postgresql://salesintel:ci-only-not-a-secret@127.0.0.1:5432/postgres
      SALESINTEL_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e "backend[dev]"
      - name: Migrations build the schema from scratch (SQLite and PostgreSQL)
        run: |
          cd backend
          DATABASE_URL="sqlite:///$RUNNER_TEMP/migrations.db" ../.venv/bin/python -m alembic -c alembic.ini upgrade head
          PGPASSWORD=ci-only-not-a-secret psql -h 127.0.0.1 -U salesintel -d postgres -c "CREATE DATABASE migrations_check"
          DATABASE_URL="postgresql://salesintel:ci-only-not-a-secret@127.0.0.1:5432/migrations_check" ../.venv/bin/python -m alembic -c alembic.ini upgrade head
      - name: Tests (tenant isolation runs on both databases; PostgreSQL is mandatory here)
        run: PYTHONPATH=backend .venv/bin/python -m pytest backend/tests -q

  frontend:
    name: Frontend unit tests and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: TypeScript
        run: pnpm --dir frontend typecheck
      - name: Unit tests
        run: pnpm --dir frontend test

  e2e:
    name: Playwright acceptance tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e "backend[dev]"
          pnpm install --frozen-lockfile
          pnpm --dir frontend exec playwright install --with-deps chromium
      - name: Acceptance tests (demo database, synthetic fixtures)
        run: pnpm --dir frontend test:e2e
      - name: Hosted acceptance tests (signed-in teams, two companies, development tokens)
        run: pnpm --dir frontend test:e2e:hosted
      - name: Keep the report when tests fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/playwright-report-hosted
            frontend/test-results
          retention-days: 7
