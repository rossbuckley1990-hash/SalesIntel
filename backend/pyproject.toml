[project]
name = "misi-backend"
version = "0.1.0"
description = "FastAPI backend for MiSi - Mitie Sales Intelligence"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "pydantic-settings>=2.10.0",
  "sqlalchemy>=2.0.0",
  "psycopg[binary]>=3.2.0",
  "openai>=2.44.0",
  "openpyxl>=3.1.0",
  "python-multipart>=0.0.20",
  "alembic>=1.16,<2",
  "reportlab>=4.4,<5",
  "python-docx>=1.2,<2",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0",
  "pytest>=8.4.0",
]

[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
